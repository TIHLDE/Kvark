name: Lint and build

on: [pull_request]

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v2
      - name: Setup Tools
        uses: tanstack/config/.github/setup@main

      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

      - name: Build
        run: pnpm build
