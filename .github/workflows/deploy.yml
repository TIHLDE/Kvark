name: "build -> push -> deploy"

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: TIHLDE/tihlde-workflows/.github/workflows/_ci_ghcr.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile
      # Deprecated site, served on mock data only: MSW intercepts the API
      # calls in the browser. VITE_API_URL is still required because the mock
      # handlers match on its origin; unmocked requests fall through to it.
      build_args: |
        APP_VERSION=${{ github.ref_name }}
        GIT_SHA=${{ github.sha }}
        VITE_ENABLE_MOCKS=true
        VITE_API_URL=https://api-dev.tihlde.org/

  deploy:
    needs: build
    permissions: {}
    uses: TIHLDE/tihlde-workflows/.github/workflows/_notify_deploy.yml@main
    with:
      deploy_url: "https://deploy-king.tihlde.org/deploy"
    secrets:
      DEPLOY_RECEIVER_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}
